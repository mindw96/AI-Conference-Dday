name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    name: Check and build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run core checks
        run: |
          swift build --product DdayCoreChecks
          .build/debug/DdayCoreChecks

      - name: Build Swift package
        run: swift build

      - name: Validate mobile privacy manifest
        run: plutil -lint Apps/Mobile/DdayMobile/PrivacyInfo.xcprivacy

      - name: Build iPhone and iPad app
        run: |
          xcodebuild \
            -project Apps/Mobile/DdayMobile.xcodeproj \
            -scheme DdayMobile \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Validate app Info.plist
        run: plutil -lint build/Dday.app/Contents/Info.plist
