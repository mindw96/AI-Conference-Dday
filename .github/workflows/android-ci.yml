name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "Apps/Android/**"
      - "data/conferences.json"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "Apps/Android/**"
      - "data/conferences.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Apps/Android/*.gradle.kts
            Apps/Android/app/*.gradle.kts
            Apps/Android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test and build
        run: |
          chmod +x Apps/Android/gradlew Apps/Android/scripts/*.sh
          Apps/Android/scripts/build_ci.sh
